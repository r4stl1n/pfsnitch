# Rules for the pfsnitch/udpdivert sub-anchor: divert all non-DNS UDP to the
# daemon. Loaded at startup so UDP is governed by the userspace divert path by
# default. The daemon empties this sub-anchor (pfctl -a pfsnitch/udpdivert -Fr)
# once the kernel module's upcall is governing UDP instead - at which point each
# datagram is decided by an in-kernel cache lookup rather than a userspace round
# trip - and reloads it (pfctl -a pfsnitch/udpdivert -f udpdivert.conf) whenever
# the upcall is not active, so UDP is never left ungoverned.
#
# The DNS pair (port 53) is NOT here: it stays in the parent anchor because
# hostname learning needs the answer payload, which no socket hook exposes.
pass out quick proto udp divert-to 127.0.0.1 port 8668 keep state
