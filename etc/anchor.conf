# pfsnitch divert rules. Loaded into the "pfsnitch" pf anchor by the
# rc.d service; flushed by the watchdog if the daemon dies.
#
# Nothing here is a filtering decision - every rule is `pass ... divert-to`.
# The daemon makes the decision. If the daemon is not listening these rules
# would blackhole traffic, which is precisely why they live in an anchor that
# can be emptied in one command.
#
# `no state` on the DNS pair is required: a reply matching state created by the
# outbound query would be passed WITHOUT rule evaluation and never diverted, so
# hostnames would never be learned.
#
# These rules are deliberately NOT qualified with inet/inet6. An unqualified pf
# rule matches both families, so these three cover IPv4 and IPv6 alike. Adding
# explicit `inet6` twins does not add coverage - pfctl collapses them into the
# unqualified rule and silently loads one, which reads like v6 rules being
# rejected when in fact they were already redundant.
#
# The divert-to *address* is likewise meaningless: pfctl parses it and throws it
# away, emitting only `divert-to <port>`. The kernel picks ip_output vs
# ip6_output from the packet's own version nibble (ip_divert.c), not from any
# address here. One socket, one port, both families.

# learn hostnames from plaintext DNS answers
pass out quick proto udp to port 53   divert-to 127.0.0.1 port 8668 no state
pass in  quick proto udp from port 53 divert-to 127.0.0.1 port 8668 no state

# intercept outbound connection attempts
pass out quick proto tcp flags S/SA divert-to 127.0.0.1 port 8668

# Everything not diverted above - other UDP, ICMP, established traffic - is
# permitted only while pfsnitch is actually running. This is what turns the
# outer `block out all` into a boot-time gate rather than a permanent block:
# an empty anchor means no outbound at all, which is exactly the state the
# machine is in before this daemon starts.
pass out all keep state
